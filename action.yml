name: "YML Change Webhook"
description: "Let your YAML declare its own subscribers. Detects changed .yml/.yaml files, reads their x-update-webhooks list, and POSTs to every URL with retries, masking and a job summary."
author: "Miew"
branding:
  icon: "hook"
  color: "blue"

inputs:
  base_ref:
    description: "Base reference for comparing changes (useful in PR scenarios)"
    required: false
    default: ""

outputs:
  changed_files:
    description: "JSON array of YML files that changed"
  webhook_results:
    description: "JSON array of webhook execution results with file mappings."

runs:
  using: "node24"
  main: "dist/index.js"
